services:
  app:
    build: .
    expose:
      - "3859:3859"
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - gov-ai-frontend-net
      - easypanel

networks:
  gov-ai-frontend-net:
    name: gov-ai-frontend-net
    ipam:
      config:
        - subnet: 10.200.200.0/24
  easypanel:
    external: true
