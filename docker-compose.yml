services:
  app:
    build: .
    expose:
      - "80"
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - gov-ai-frontend-net
      - default

networks:
  gov-ai-frontend-net:
    name: gov-ai-frontend-net
    ipam:
      config:
        - subnet: 10.200.200.0/24
  default:
    external: true
    name: easypanel
