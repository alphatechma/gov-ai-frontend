services:
  app:
    build: .
    expose:
      - "80"
    restart: unless-stopped
    env_file:
      - .env
    networks:
      easypanel:
        aliases:
          - app-internal
      gov-ai-frontend-net: {}

networks:
  gov-ai-frontend-net:
    name: gov-ai-frontend-net
    ipam:
      config:
        - subnet: 10.200.200.0/24
  easypanel:
    external: true
